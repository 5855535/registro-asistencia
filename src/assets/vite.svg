<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo limpio para contraste -->
  <rect width="400" height="400" rx="40" fill="#edf7f0"/>

  <!-- Definición del gradiente corporativo de tu app -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3d20" />
      <stop offset="100%" stop-color="#22a55b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0a3d20" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Contenedor del Isotipo con Sombra Elegante -->
  <g filter="url(#shadow)">
    <!-- Barra 1: Historial Inicial (Pasado) -->
    <rect x="110" y="190" width="35" height="100" rx="17.5" fill="url(#logoGrad)" opacity="0.4" />
    
    <!-- Barra 2: Registro de Datos (Progreso) -->
    <rect x="175" y="140" width="35" height="150" rx="17.5" fill="url(#logoGrad)" opacity="0.76" />
    
    <!-- Barra 3: Tiempo Presente (Control) -->
    <rect x="240" y="90" width="35" height="200" rx="17.5" fill="url(#logoGrad)" />
    
    <!-- Manecilla Dinámica de Reloj / Rayo Modernizado -->
    <path d="M257.5 150L305 102" stroke="url(#logoGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
